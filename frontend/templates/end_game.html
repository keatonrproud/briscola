<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briscola</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script
        src="https://js-de.sentry-cdn.com/5f17bc809837d10d6efa3f8b3036d42c.min.js"
        crossorigin="anonymous"
    ></script>
    <script type="module" src="/static/js/websocket.js" defer></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="/static/script.js" defer></script>
    <script type="module">
        import { socket } from '/static/js/websocket.js';

        import { checkIfInGame } from '/static/script.js';
        await checkIfInGame();

        // Event listener for the 'end_game_response' event from the server
        socket.on('game_not_complete', function() {
            window.location.href = '/turn';
        });

        // Event listener for the 'end_game_response' event from the server
        socket.on('end_game_response', function(data) {
            console.log('End game data received:', data);
            const messageElement = document.querySelector('.message');
            if (data && data.message) {
                messageElement.textContent = data.message;
            } else {
                messageElement.textContent = 'Game Ended!';
            }

            const finalScores = document.querySelector('.final-scores');
            finalScores.innerHTML = ''; // Clear existing scores

            if (!data || !data.scores || !Array.isArray(data.scores) || data.scores.length === 0) {
                const noScoresMsg = document.createElement('div');
                noScoresMsg.className = 'player-score-info no-scores';
                noScoresMsg.textContent = 'No scores available';
                finalScores.appendChild(noScoresMsg);
                return;
            }

            const scoresInfo = data.scores;
            scoresInfo.forEach((score) => {
                const scoreEntry = document.createElement('div');
                scoreEntry.className = 'player-score-info';

                // Format player name if it's an enum
                let playerName = score[0];
                if (typeof playerName === 'string' && playerName.includes('TeamName.')) {
                    playerName = 'Team ' + playerName.split('.').pop();
                }

                const nameSpan = document.createElement('span');
                nameSpan.textContent = playerName;
                scoreEntry.appendChild(nameSpan);

                const scoreSpan = document.createElement('span');
                scoreSpan.textContent = score[1];
                scoreEntry.appendChild(scoreSpan);

                finalScores.appendChild(scoreEntry);
            });
            
            // Apply custom styling for better visibility
            document.querySelectorAll('.player-score-info').forEach(entry => {
                entry.style.padding = '10px';
                entry.style.margin = '5px 0';
                entry.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                entry.style.borderRadius = '5px';
                entry.style.display = 'flex';
                entry.style.justifyContent = 'space-between';
            });
        });

        socket.emit('end_game');
        socket.emit('leave_game');

    </script>
</head>
<body>
    <!-- Main content area for game over message and button -->
    <div class="game-over-card">
        <p class="message">{{ winner_message }}</p>
        <div class="final-scores"></div>
        <div class="game-over-header"></div>
        <button class="button" onclick="window.location.href='/'">Return Home</button>
    </div>
</body>
</html>
