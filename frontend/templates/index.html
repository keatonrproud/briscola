<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Briscola</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script
        src="https://js-de.sentry-cdn.com/5f17bc809837d10d6efa3f8b3036d42c.min.js"
        crossorigin="anonymous"
    ></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="/static/js/websocket.js"></script>
    <script type="module" src="/static/script.js" defer></script>
    <script data-goatcounter="https://briscola.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    <div class="container">
        <div class="intro-card">
            <h1 class="title">Welcome to Briscola!</h1>
            <br>

            <!-- Game Mode Selector -->
            <div class="game-mode-selector">
                <span class="mode-label left-label" aria-label="Computer">💻</span>
                <label class="toggle">
                    <input type="checkbox" id="game-mode-toggle">
                    <span class="slider"></span>
                </label>
                <span class="mode-label right-label" aria-label="Local">👥</span>
            </div>

            <!-- Difficulty Slider -->
            <div class="difficulty-slider-container">
                <label for="difficulty-slider" class="difficulty-label" title="Computer Difficulty">🔥</label>
                <input type="range" id="difficulty-slider" class="difficulty-slider" min="1" max="10000" value="10000">
            </div>

            <div class="room-section invisible">
                <div class="room-controls">
                    <div id="create-room-section">
                        <div id="player-count-selector" style="margin-bottom: 1rem;">
                            <span class="h3">Players:</span>
                            <div class="player-count-buttons">
                                <button class="player-count-btn active" data-count="2">2 Players</button>
                                <button class="player-count-btn" data-count="4">4 Players</button>
                            </div>
                        </div>
                        <button id="create-room-btn" class="button">Create Room</button>
                    </div>
                    <div class="available-rooms-section">
                        <h3>Available Rooms</h3>
                        <div id="available-rooms-list">
                            <!-- Available rooms will be displayed here -->
                            <div class="no-rooms-message">No rooms available</div>
                        </div>
                        <button id="refresh-rooms-btn" class="button">Refresh Rooms</button>
                    </div>
                    <div class="room-join-section">
                        <input type="text" id="room-code-input" placeholder="Enter room code" maxlength="4" style="margin-bottom: 0.5rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 5px; text-transform: uppercase;">
                        <button id="join-room-btn" class="button">Join Room</button>
                    </div>
                    <div id="current-room-info" style="display: none; margin-top: 1rem;">
                        <p><strong>Room Code: <span id="current-room-code"></span></strong></p>
                        <p>Players: <span id="current-room-players">0</span>/<span id="max-players">2</span></p>
                        <button id="leave-room-btn" class="button">Leave Room</button>
                    </div>
                </div>
            </div>

            <button class="button" id="start-game-btn">Start Local Game</button>
            <div class="greyed-message-container">
                <span id="guide-text" class="h3 greyed-message"><a href="https://chatgpt.com/share/67c3c6f9-10f8-8003-8b14-f6eedf620672" target="_blank">Learn to play</a></span>
            </div>

        </div>

    </div>
    <div class="repo-text-container">
        <span id="repo-text" class="h3 hidden-message"><a href="https://www.github.com/keatonrproud/briscola" target="_blank">Contributions + Source Code</a></span>
    </div>

    <script type="module">
            import { socket } from '/static/js/websocket.js';

            document.addEventListener('DOMContentLoaded', () => {
                // Define classes to match backend event types
                const EmitType = {
                    ROOM_UPDATE: "room_update",
                    ROOM_CREATED: "room_created",
                    ROOM_JOINED: "room_joined",
                    ROOM_CLOSED: "room_closed",
                    GAME_STATE: "game_state",
                    ACTIVE_CARD_PLAYED: "active_card_played",
                    END_PLAY: "end_play",
                    END_GAME: "end_game_response",
                    FORCE_LEAVE: "force_leave_room",
                    ERROR: "error",
                    IN_GAME_CHECK: "in_game_check_result",
                    GAME_NOT_COMPLETE: "game_not_complete"
                };

                const RoomUpdateKeys = {
                    ROOM: "room",
                    PLAYERS: "users",
                    PLAYER_COUNT: "player_count",
                    MAX_PLAYERS: "max_players"
                };

                const RoomCreateJoinKeys = {
                    ROOM_CODE: "room_code",
                    PLAYER_COUNT: "player_count",
                    MAX_PLAYERS: "max_players"
                };

                const ErrorKeys = {
                    MESSAGE: "message"
                };

                const ForceLeaveKeys = {
                    MESSAGE: "message"
                };

                const startGameButton = document.getElementById('start-game-btn');
                const gameModeToggle = document.getElementById('game-mode-toggle');
                const leftLabel = document.querySelector('.left-label');
                const rightLabel = document.querySelector('.right-label');
                const difficultySlider = document.getElementById('difficulty-slider');
                const difficultySliderContainer = document.querySelector('.difficulty-slider-container');
                const difficultyLabel = document.querySelector('.difficulty-label');
                const roomSection = document.querySelector('.room-section');
                const createRoomBtn = document.getElementById('create-room-btn');
                const joinRoomBtn = document.getElementById('join-room-btn');
                const leaveRoomBtn = document.getElementById('leave-room-btn');
                const roomCodeInput = document.getElementById('room-code-input');
                const currentRoomInfo = document.getElementById('current-room-info');
                const currentRoomCode = document.getElementById('current-room-code');
                const currentRoomPlayers = document.getElementById('current-room-players');
                const maxPlayers = document.getElementById('max-players');
                const playerCountButtons = document.querySelectorAll('.player-count-btn');
                const createRoomSection = document.getElementById('create-room-section');
                const availableRoomsSection = document.querySelector('.available-rooms-section');
                const availableRoomsList = document.getElementById('available-rooms-list');
                const refreshRoomsBtn = document.getElementById('refresh-rooms-btn');
                const playerCountSelector = document.getElementById('player-count-selector');
                
                let selectedPlayerCount = 2; // Default to 2 players
                let currentRoom = null;
                let currentRoomMaxPlayers = 2;

                // Function to fetch and display available rooms
                function fetchAvailableRooms() {
                    fetch('/api/get_available_rooms')
                        .then(response => response.json())
                        .then(data => {
                            availableRoomsList.innerHTML = ''; // Clear existing rooms
                            
                            if (data.rooms && data.rooms.length > 0) {
                                data.rooms.forEach(room => {
                                    const roomItem = document.createElement('div');
                                    roomItem.className = 'available-room-item';
                                    roomItem.innerHTML = `
                                        <span class="room-code">${room.room_code}</span>
                                        <span class="room-players">${room.player_count}/${room.max_players} players</span>
                                    `;
                                    roomItem.addEventListener('click', () => {
                                        joinRoomByCode(room.room_code);
                                    });
                                    availableRoomsList.appendChild(roomItem);
                                });
                            } else {
                                availableRoomsList.innerHTML = '<div class="no-rooms-message">No rooms available</div>';
                            }
                        })
                        .catch(error => {
                            console.error('Error fetching available rooms:', error);
                            availableRoomsList.innerHTML = '<div class="no-rooms-message">Error loading rooms</div>';
                        });
                }

                // Join room by code function
                function joinRoomByCode(roomCode) {
                    if (!roomCode) {
                        alert('Please enter a room code');
                        return;
                    }
                    
                    try {
                        if (!socket.connected) {
                            console.log('Socket not connected yet, waiting...');
                            socket.on('connect', () => {
                                socket.emit('join_room_by_code', { room_code: roomCode });
                            });
                        } else {
                            socket.emit('join_room_by_code', { room_code: roomCode });
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Failed to join room');
                    }
                }

                refreshRoomsBtn.addEventListener('click', fetchAvailableRooms);

                playerCountButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        playerCountButtons.forEach(btn => btn.classList.remove('active'));
                        button.classList.add('active');
                        selectedPlayerCount = parseInt(button.getAttribute('data-count'));
                        maxPlayers.textContent = selectedPlayerCount;
                    });
                });

                function updateDifficultyLabelFontSize() {
                    const sliderValue = difficultySlider.value;
                    let remFontSize = 2.25 + (sliderValue / 10000 * 0.5); // Max font size will be 36px
                    let opacity = 0.5 + (sliderValue / 10000 * 0.5);
                    difficultyLabel.style.fontSize = `${remFontSize}rem`;
                    difficultyLabel.style.opacity = `${opacity}`;
                }
                updateDifficultyLabelFontSize();

                // Update font size as the slider value changes
                difficultySlider.addEventListener('input', updateDifficultyLabelFontSize);

                function updateRoomBtns(playerCount) {
                    // Update the current room players count
                    if (currentRoomPlayers) {
                        currentRoomPlayers.textContent = playerCount;
                    }
                    if (maxPlayers) {
                        maxPlayers.textContent = currentRoomMaxPlayers || selectedPlayerCount;
                    }
                    
                    // Make sure playerCount is a number
                    playerCount = parseInt(playerCount) || 0;
                    console.log(`Updating room buttons: ${playerCount}/${currentRoomMaxPlayers} players`);
                    
                    updateStartGameButtonText(playerCount);
                }

                function manualUpdateRoomsBtns() {
                    // Only fetch room users if we're in a room
                    if (currentRoom) {
                        fetch(`/api/get_waiting_room_users?room=${currentRoom}`)
                            .then(response => response.json())
                            .then(data => {
                                if (data.error) {
                                    console.error('Room not found:', data.error);
                                } else {
                                    console.log('Room users fetched:', data.users.length, '/', currentRoomMaxPlayers);
                                    updateRoomBtns(data.users.length);
                                }
                            })
                            .catch(error => {
                                console.error('Fetch error:', error);
                            });
                    } else {
                        // Reset UI for no room
                        updateRoomBtns(0);
                    }
                }

                function updateLabels() {

                    manualUpdateRoomsBtns();

                    if (gameModeToggle.checked) {
                        leftLabel.style.opacity = '0.5';
                        rightLabel.style.opacity = '1';
                        difficultySliderContainer.classList.add('invisible');
                        roomSection.classList.remove('invisible');
                        
                        // Fetch available rooms when switching to multiplayer mode
                        if (!currentRoom) {
                            fetchAvailableRooms();
                        }
                    } else {
                        leftLabel.style.opacity = '1';
                        rightLabel.style.opacity = '0.5';
                        difficultySliderContainer.classList.remove('invisible');
                        roomSection.classList.add('invisible');
                        // Reset to 2 players for local games
                        playerCountButtons.forEach(btn => btn.classList.remove('active'));
                        playerCountButtons[0].classList.add('active'); // Select "2 Players"
                        selectedPlayerCount = 2;
                    }
                }


                // Ensure the toggle label clicks work to change the game mode
                leftLabel.addEventListener('click', () => {
                    gameModeToggle.checked = false;
                    updateLabels();
                });

                rightLabel.addEventListener('click', () => {
                    gameModeToggle.checked = true;
                    updateLabels();
                });

                gameModeToggle.addEventListener('change', updateLabels);
                updateLabels(); // Initial call to set the correct state on page load

                // Function to update the Start Game button text
                function updateStartGameButtonText(playerCount = 0) {
                    if (gameModeToggle.checked && currentRoom) {
                        // Ensure we're working with numbers
                        playerCount = parseInt(playerCount) || 0;
                        const maxPlayers = parseInt(currentRoomMaxPlayers) || 2;
                        
                        console.log(`Updating button: ${playerCount}/${maxPlayers} players`);
                        
                        if (playerCount < maxPlayers) {
                            startGameButton.textContent = `Waiting for players (${playerCount}/${maxPlayers})`;
                            startGameButton.disabled = true;
                        } else {
                            startGameButton.disabled = false;
                            startGameButton.textContent = "Start Online Game";
                            console.log('Button enabled: Room is full');
                        }
                    } else {
                        startGameButton.disabled = false;
                        startGameButton.textContent = "Start Local Game";
                    }
                }

                function updateRoomDisplay() {
                    if (currentRoom) {
                        currentRoomInfo.style.display = 'block';
                        createRoomSection.style.display = 'none';
                        availableRoomsSection.style.display = 'none';
                        joinRoomBtn.parentElement.style.display = 'none';
                        currentRoomCode.textContent = currentRoom;
                        leaveRoomBtn.style.display = 'inline-block';
                    } else {
                        currentRoomInfo.style.display = 'none';
                        createRoomSection.style.display = 'block';
                        availableRoomsSection.style.display = 'block';
                        joinRoomBtn.parentElement.style.display = 'block';
                        leaveRoomBtn.style.display = 'none';
                        fetchAvailableRooms(); // Refresh available rooms when leaving a room
                    }
                }

                // Create room button click handler
                createRoomBtn.addEventListener('click', async () => {
                    try {
                        if (!socket.connected) {
                            console.log('Socket not connected yet, waiting...');
                            await new Promise((resolve) => socket.on('connect', resolve));
                        }
                        socket.emit('create_room', { player_count: selectedPlayerCount });
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Failed to create room');
                    }
                });

                // Join room button click handler
                joinRoomBtn.addEventListener('click', () => {
                    const roomCode = roomCodeInput.value.trim().toUpperCase();
                    joinRoomByCode(roomCode);
                });

                // Leave room button click handler
                leaveRoomBtn.addEventListener('click', () => {
                    if (currentRoom) {
                        socket.emit('leave_room', { room: currentRoom });
                        currentRoom = null;
                        updateRoomDisplay();
                        updateStartGameButtonText();
                    }
                });

                // Auto-uppercase room code input
                roomCodeInput.addEventListener('input', (e) => {
                    e.target.value = e.target.value.toUpperCase();
                });

                // Listen for the game state response
                socket.on(EmitType.GAME_STATE, (data) => {
                    console.log('Received game state response:', data);
                    if (data.error) {
                        console.error('Error:', data.error);
                        alert('Error starting game: ' + data.error);
                    } else {
                        console.log('Starting game, navigating to /turn');
                        window.location.href = '/turn';
                    }
                });

                startGameButton.addEventListener('click', async () => {
                    // Skip if button is disabled
                    if (startGameButton.disabled) {
                        console.log('Button is disabled, not sending start_game event');
                        return;
                    }

                    const gameMode = gameModeToggle.checked ? 'online' : 'local';
                    const difficulty = difficultySlider.value; // Get the difficulty value
                    const maxPlayers = gameMode === 'online' ? currentRoomMaxPlayers : selectedPlayerCount;

                    try {
                        if (!socket.connected) {
                            console.log('Socket not connected yet, waiting...');
                            await new Promise((resolve) => socket.on('connect', resolve));
                        }
                        
                        // For online games, use the current room
                        if (gameMode === 'online' && currentRoom) {
                            // Get the current number of players in the room to double check
                            const currentPlayersCount = parseInt(currentRoomPlayers.textContent) || 0;
                            
                            console.log(`Starting online game with room: ${currentRoom} (${currentPlayersCount}/${currentRoomMaxPlayers} players)`);
                            socket.emit('start_game', {
                                gameMode: gameMode, 
                                difficulty: difficulty, 
                                playerCount: parseInt(currentRoomMaxPlayers), // This is the max players for the game
                                room: currentRoom
                            });
                        } else {
                            console.log('Starting local game');
                            socket.emit('start_game', {
                                gameMode: gameMode, 
                                difficulty: difficulty, 
                                playerCount: maxPlayers // Use max players for local game
                            });
                        }
                    } catch (error) {
                        console.error('Error:', error);
                    }
                });

                // Socket event listeners for room management
                socket.on(EmitType.ROOM_CREATED, (data) => {
                    console.log('Room created:', data);
                    currentRoom = data[RoomCreateJoinKeys.ROOM_CODE];
                    currentRoomMaxPlayers = parseInt(data[RoomCreateJoinKeys.MAX_PLAYERS]) || 2;
                    const playerCount = parseInt(data[RoomCreateJoinKeys.PLAYER_COUNT]) || 1;
                    
                    maxPlayers.textContent = currentRoomMaxPlayers;
                    currentRoomPlayers.textContent = playerCount;
                    roomCodeInput.value = '';
                    updateRoomDisplay();
                    
                    updateStartGameButtonText(playerCount); 
                    alert(`Room created! Code: ${data[RoomCreateJoinKeys.ROOM_CODE]}`);
                });

                socket.on(EmitType.ROOM_JOINED, (data) => {
                    console.log('Room joined:', data);
                    currentRoom = data[RoomCreateJoinKeys.ROOM_CODE];
                    currentRoomMaxPlayers = parseInt(data[RoomCreateJoinKeys.MAX_PLAYERS]) || 2;
                    const playerCount = parseInt(data[RoomCreateJoinKeys.PLAYER_COUNT]) || 0;
                    
                    maxPlayers.textContent = currentRoomMaxPlayers;
                    currentRoomPlayers.textContent = playerCount;
                    roomCodeInput.value = '';
                    updateRoomDisplay();
                    
                    // Use the player count from the server response directly
                    console.log(`Room ${currentRoom} has ${playerCount}/${currentRoomMaxPlayers} players`);
                    updateStartGameButtonText(playerCount);
                });

                socket.on(EmitType.ROOM_UPDATE, (data) => {
                    console.log('Room update received:', data);
                    if (data[RoomUpdateKeys.ROOM] === currentRoom) {
                        const playerCount = parseInt(data[RoomUpdateKeys.PLAYER_COUNT]) || 0;
                        currentRoomPlayers.textContent = playerCount;
                        
                        if (data[RoomUpdateKeys.MAX_PLAYERS]) {
                            currentRoomMaxPlayers = parseInt(data[RoomUpdateKeys.MAX_PLAYERS]) || 2;
                            maxPlayers.textContent = currentRoomMaxPlayers;
                        }
                        
                        updateStartGameButtonText(playerCount);
                    }
                });

                socket.on(EmitType.FORCE_LEAVE, (data) => {
                    alert(data[ForceLeaveKeys.MESSAGE]);
                    currentRoom = null;
                    updateRoomDisplay();
                    updateStartGameButtonText();
                });

                socket.on(EmitType.ERROR, (data) => {
                    alert(data[ErrorKeys.MESSAGE]);
                });



                const cardNumbers = ['ace', 'two', 'three', 'four', 'five', 'six', 'seven', 'soldier', 'horse', 'king'];
                const suits = ['sword', 'club', 'coin', 'cup'];
                const images = [];
                let imagesLoaded = 0;

                // Function to preload a single image
                function preloadImage(url) {
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        img.src = url;
                        img.onload = () => {
                            images.push(img);
                            imagesLoaded++;
                            resolve();
                        };
                        img.onerror = (err) => {
                            console.error(`Failed to load image: ${url}`, err); // Log errors
                            reject(err);
                        };
                    });
                }

                // Function to preload all images
                function preloadAllImages() {
                    const promises = [];
                    for (const number of cardNumbers) {
                        for (const suit of suits) {
                            const url = `https://s3.eu-north-1.amazonaws.com/briscola.pro/piacentine/piacentine/${number}_${suit}.png`.toLowerCase();
                            promises.push(preloadImage(url));
                        }
                    }
                    return Promise.all(promises);
                }

                // only preload images when online and pulling images via AWS, otherwise we use local images
                if (navigator.onLine) {
                    preloadAllImages()
                        .catch(err => {
                            console.error('An error occurred while preloading images:', err);
                        });
                }

        })
    </script>

</body>
</html>
